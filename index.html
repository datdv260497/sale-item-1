<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chúc Mừng Năm Mới</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ff8c00, #c8102e, #8b0000); /* cam → đỏ tươi → đỏ đậm */
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .container {
      max-width: 90%;
    }

    h1 {
      font-size: 6.5rem;
      font-weight: 900;
      margin-bottom: 1.5rem;
      color: #ffffff;             /* trắng sáng để nổi bật trên nền cam-đỏ */
      text-shadow: 
        0 0 15px rgba(0,0,0,0.7),
        0 4px 12px rgba(0,0,0,0.8); /* shadow đen đậm giúp chữ rõ nét */
      letter-spacing: 4px;
    }

    .year {
      font-size: 11rem;
      font-weight: 900;
      color: #ffeb3b;             /* vàng sáng nổi bật */
      text-shadow: 
        0 0 25px rgba(0,0,0,0.8),
        0 6px 18px rgba(0,0,0,0.9); /* shadow mạnh hơn để chống mờ */
      letter-spacing: 5px;
    }

    @media (max-width: 768px) {
      h1 { font-size: 5rem; }
      .year { font-size: 8rem; }
    }

    @media (max-width: 480px) {
      h1 { font-size: 4rem; }
      .year { font-size: 6.5rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>CHÚC MỪNG<br>NĂM MỚI</h1>
    <div class="year">2026</div>
  </div>

</body>
</html>
